[project]
name = "data-incident-gym"
version = "0.1.0"
description = "A reproducible data-incident diagnosis agent benchmark."
requires-python = ">=3.12,<3.13"
dependencies = [
  "dbt-core==1.12.3",
  "dbt-postgres==1.11.0",
  "jinja2==3.1.6",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "pydantic-ai-slim[openai]==2.34.0",
  "pydantic-settings==2.15.0",
  "typer==0.27.1",
]

[project.scripts]
data-incident-gym = "data_incident_gym.cli:app"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.4",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_incident_gym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
  "integration: requires Docker and PostgreSQL",
  "e2e: runs repeated real PostgreSQL and dbt workflows",
  "ollama: requires explicitly enabled local Ollama and qwen3.5:9b",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
